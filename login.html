<!DOCTYPE html>
<html>
<head>
    <title>Patient Login</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f6ff;
            margin: 0;
            padding: 50px;
        }

        .container {
            background-color: white;
            width: 400px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
        }

        h1 {
            text-align: center;
            color: #2c3e50;
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 10px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background-color: #3498db;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #2980b9;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Patient Login</h1>

        <form id="loginForm">

            <label>Email:</label>

            <input
                type="email"
                id="email"
                required
            >

            <label>Password:</label>

            <input
                type="password"
                id="password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <p id="message"></p>

    </div>

    <script>

        document
            .getElementById("loginForm")
            .addEventListener("submit", async function(event) {

                event.preventDefault();

                const email =
                    document.getElementById("email").value;

                const password =
                    document.getElementById("password").value;

                try {

                    const response = await fetch(
                        "http://127.0.0.1:8000/login",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type": "application/json"
                            },

                            body: JSON.stringify({
                                email: email,
                                password: password
                            })
                        }
                    );

                    const data =
                        await response.json();

                    document.getElementById("message").innerText =
                        data.message;

                    if (data.message === "Login successful") {

                        setTimeout(function() {

                            window.location.href = "index.html";

                        }, 1000);

                    }

                } catch (error) {

                    console.error(error);

                    document.getElementById("message").innerText =
                        "Unable to connect to the server.";

                }

            });

    </script>

</body>
</html>
